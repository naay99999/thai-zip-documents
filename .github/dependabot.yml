version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ['*']
        # thaizip / react-thaizip bumps change what the site documents; review them on their own.
        exclude-patterns: ['thaizip', 'react-thaizip']
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
